<!DOCTYPE html>
<html manifest="pitlog.appcache">
<head>
<meta charset="utf-8">
<title>PitLog</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PitLog">
<meta name="theme-color" content="#14171a">
<link rel="manifest" href="manifest.webmanifest">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<style>
*{-webkit-box-sizing:border-box;-moz-box-sizing:border-box;box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35;background:#eef0f3;color:#14171a;-webkit-tap-highlight-color:rgba(0,0,0,0)}
[data-act]{cursor:pointer}
.top{background:#14171a;color:#fff;padding:8px 12px}
.top:after,.row:after,.bar:after,.cf:after{content:"";display:table;clear:both}
.brand{float:left;font-weight:bold;font-size:22px;line-height:44px;margin-right:14px}
.brand span{color:#ff6a13}
.brand small{font-size:13px;font-weight:normal;color:#aab3bd;margin-left:6px}
.nav{float:left}
.nav button{-webkit-appearance:none;float:left;background:transparent;border:0;color:#cfd6dd;font-size:16px;font-weight:bold;min-height:44px;padding:0 14px;border-radius:8px;font-family:inherit;cursor:pointer}
.nav button.on{background:#ff6a13;color:#fff}
.tr{float:right;text-align:right;line-height:44px;font-size:13px;color:#9fd8b0}
.tr .pill{margin-left:6px}
.wrap{padding:12px}
.card{background:#fff;-webkit-border-radius:10px;border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid #dde1e6}
h2{font-size:22px;line-height:44px}
h3{font-size:17px;margin:0 0 8px}
p{margin-bottom:8px}
.fl{float:left}.fr{float:right}
.sub{font-size:14px;color:#5b6570}
.bar{margin-bottom:10px}
.btn{-webkit-appearance:none;display:inline-block;min-height:44px;padding:0 16px;line-height:42px;-webkit-border-radius:8px;border-radius:8px;border:1px solid #c5cbd3;background:#fff;color:#14171a;font-size:16px;font-weight:bold;margin:0 6px 6px 0;text-decoration:none;font-family:inherit;cursor:pointer;vertical-align:middle}
.btn.pri{background:#ff6a13;border-color:#ff6a13;color:#fff}
.btn.dng{border-color:#c62828;color:#c62828}
.btn.sm{min-height:36px;line-height:34px;padding:0 12px;font-size:14px}
.fld{display:block;margin-bottom:8px}
.lb{display:block;font-size:13px;color:#5b6570;margin-bottom:3px;font-weight:bold}
.lb i{font-style:normal;font-weight:normal}
input[type=text],input[type=number],select,textarea{-webkit-appearance:none;width:100%;font-size:18px;padding:8px 10px;min-height:44px;border:1px solid #c5cbd3;-webkit-border-radius:8px;border-radius:8px;background:#fff;color:#14171a;font-family:inherit}
textarea{min-height:70px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:#ff6a13;outline:none}
.selw{position:relative;display:block}
.selw:after{content:"\25BE";position:absolute;right:12px;top:11px;pointer-events:none;color:#5b6570}
.selw select{padding-right:30px}
.chk{display:block;min-height:44px;padding:9px 0;line-height:1.3;font-weight:bold}
.chk input{width:26px;height:26px;vertical-align:middle;margin-right:8px}
.row{margin:0 -6px}
.col{float:left;padding:0 6px}
.c2{width:50%}.c3{width:33.333%}.c4{width:25%}
.car{border:2px dashed #c5cbd3;-webkit-border-radius:14px;border-radius:14px;padding:4px 6px}
.axle{text-align:center;font-size:12px;letter-spacing:3px;color:#8a949e;font-weight:bold;padding:2px 0}
.cn{float:left;width:50%;padding:6px}
.cnh{font-weight:bold;font-size:14px;margin-bottom:4px}
.mini{font-size:12px;color:#8a949e;text-align:center;font-weight:bold}
.tt .col{padding:0 3px}.tt{margin:0 -3px}
.tt input{padding:8px 4px;text-align:center}
.live{font-size:14px;color:#5b6570;margin-top:4px;min-height:18px}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid #e3e6ea;text-align:left;white-space:nowrap}
th{font-size:12px;color:#5b6570;text-transform:uppercase}
td.n,th.n{text-align:right}
tr.tap:active td{background:#fff3ea}
.seg{display:inline-block;border:1px solid #ff6a13;-webkit-border-radius:8px;border-radius:8px;overflow:hidden;margin-bottom:12px;vertical-align:middle}
.seg button{-webkit-appearance:none;float:left;border:0;background:transparent;color:#ff6a13;font-size:16px;font-weight:bold;min-height:44px;padding:0 18px;font-family:inherit;cursor:pointer}
.seg button.on{background:#ff6a13;color:#fff}
.pill{display:inline-block;padding:2px 8px;-webkit-border-radius:10px;border-radius:10px;font-size:12px;font-weight:bold;line-height:16px;vertical-align:middle}
.p-out{background:#fff0e0;color:#b45309}.p-done{background:#e3f4e8;color:#2e7d32}.p-new{background:#e8ebef;color:#5b6570}.p-sync{background:#fff0e0;color:#b45309}
.warn{padding:8px 10px;-webkit-border-radius:8px;border-radius:8px;margin-bottom:6px;font-size:15px}
.w-high{background:#fde8e8;color:#a31515;border-left:5px solid #c62828}
.w-med{background:#fff4e0;color:#8a4b00;border-left:5px solid #e08a00}
.w-info{background:#e8f0fb;color:#0d47a1;border-left:5px solid #1565c0}
.w-ok{background:#e3f4e8;color:#1b5e20;border-left:5px solid #2e7d32}
.hint{font-size:13px;color:#6b7580;margin-top:6px}
.stat{display:inline-block;min-width:150px;margin:0 14px 12px 0;vertical-align:top}
.stat span{display:block;font-size:12px;color:#6b7580;text-transform:uppercase;font-weight:bold}
.stat b{display:block;font-size:22px}
.stamp{min-height:44px;line-height:44px;font-size:18px;font-weight:bold}
.stamp .btn{margin-left:6px;margin-bottom:0}
.watch{font-size:80px;font-weight:bold;text-align:center;font-family:"Courier New",Courier,monospace;padding:10px 0}
.sess h3{margin:4px 0}
.good{color:#2e7d32}.bad{color:#c62828}
canvas{display:block}
@media (max-width: 640px) {
.wrap{padding:8px}
.top{padding:6px 8px}
.brand{font-size:18px;margin-right:6px}.brand small{display:none}
.nav button{padding:0 8px;font-size:14px}
.tr{float:none;clear:both;line-height:22px;text-align:left}
.c3,.c4{width:50%}.c2{width:100%}
.tt .c3{width:33.333%}
.seg{display:block;white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg button{float:none;display:inline-block;padding:0 10px;font-size:14px}
.stat{min-width:120px;margin-right:8px}
h2{font-size:20px}
.watch{font-size:56px}
.card{padding:10px}
}
@media (max-width: 400px) { .c3{width:100%} .tt .c3{width:33.333%} }
body.dark{background:#0e1013;color:#eceff3}
.dark .card{background:#1a1e23;border-color:#2b3037}
.dark .btn{background:#232830;border-color:#3a414b;color:#eceff3}
.dark .btn.pri{background:#ff6a13;border-color:#ff6a13;color:#fff}
.dark .btn.dng{color:#ff8a80;border-color:#c62828}
.dark input[type=text],.dark input[type=number],.dark select,.dark textarea{background:#0f1216;color:#eceff3;border-color:#3a414b}
.dark th,.dark td{border-color:#2b3037}
.dark .lb,.dark .sub,.dark .live,.dark th,.dark .hint,.dark .stat span{color:#9aa4ae}
.dark .car{border-color:#3a414b}
.dark .w-high{background:#3a1414;color:#ffb4b4}.dark .w-med{background:#3a2a10;color:#ffd08a}.dark .w-info{background:#10233d;color:#a9c8ff}.dark .w-ok{background:#12301a;color:#a8e0b4}
.dark tr.tap:active td{background:#2a2018}
</style>
</head>
<body>
<div id="app"><div class="wrap">Loading PitLog...</div></div>
<script>
(function () {
  'use strict';

  var VERSION = '1.3.0';
  var KEY = 'pitlog_v1', KEY_PREV = 'pitlog_prev', KEY_UI = 'pitlog_ui', KEY_WATCH = 'pitlog_watch';
  var C4 = ['FL', 'FR', 'RL', 'RR'];
  var CNAME = { FL: 'Front left', FR: 'Front right', RL: 'Rear left', RR: 'Rear right' };
  var TYPES = ['Practice', 'Qualifying', 'Race', 'Test', 'Shakedown'];
  var WEATHER = ['', 'Dry', 'Damp', 'Wet', 'Mixed'];
  var FEEL = ['', 'Understeer', 'Neutral', 'Oversteer'];
  var ATM_PSI = 14.696;

  var DB, S, W, saveTimer = null, watchTimer = null, syncBusy = false;

  /* ---------- small helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function uid() { return 'x' + Date.now().toString(36) + Math.floor(Math.random() * 1e8).toString(36); }
  function isNum(v) { return typeof v === 'number' && !isNaN(v) && isFinite(v); }
  function isArr(v) { return Object.prototype.toString.call(v) === '[object Array]'; }
  function isObj(v) { return v !== null && typeof v === 'object' && !isArr(v); }
  function num(str) {
    if (str === null || str === undefined) return null;
    str = String(str).replace(',', '.').trim();
    if (str === '') return null;
    var v = parseFloat(str);
    return isNum(v) ? v : null;
  }
  function round(v, dp) { var m = Math.pow(10, dp); return Math.round(v * m) / m; }
  function trim0(v, dp) { return isNum(v) ? String(round(v, dp)) : ''; }
  function fx(v, dp) { return isNum(v) ? v.toFixed(dp) : '-'; }
  function sgn(v, dp) { if (!isNum(v)) return '-'; var s = v.toFixed(dp); return v > 0 ? '+' + s : s; }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function hms(ts) { if (!ts) return ''; var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function dateTime(ts) { if (!ts) return 'never'; var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hms(ts); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dur(ms) {
    if (!isNum(ms) || ms < 0) return '-';
    var s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return (h ? h + ':' + pad(m) : m) + ':' + pad(ss);
  }
  function lapFmt(sec) {
    if (!isNum(sec)) return '-';
    sec = Math.round(sec * 1000) / 1000;
    var m = Math.floor(sec / 60), s = sec - m * 60, str = s.toFixed(3);
    if (m > 0) { if (s < 10) str = '0' + str; return m + ':' + str; }
    return str;
  }
  function parseLap(tok) {
    tok = tok.trim();
    if (!tok) return null;
    if (tok.indexOf(':') >= 0) {
      var p = tok.split(':');
      if (p.length !== 2) return null;
      var m = parseInt(p[0], 10), s = parseFloat(p[1]);
      if (isNaN(m) || isNaN(s)) return null;
      return m * 60 + s;
    }
    var v = parseFloat(tok);
    return isNum(v) && /^[0-9.]+$/.test(tok) ? v : null;
  }
  function parseLaps(str) {
    var out = { list: [], bad: 0 };
    if (!str) return out;
    var toks = String(str).split(/[\s;,]+/);
    for (var i = 0; i < toks.length; i++) {
      if (!toks[i]) continue;
      var v = parseLap(toks[i]);
      if (isNum(v) && v > 0) out.list.push(v); else out.bad++;
    }
    return out;
  }
  function avg(arr) { var s = 0, n = 0; for (var i = 0; i < arr.length; i++) if (isNum(arr[i])) { s += arr[i]; n++; } return n ? s / n : null; }
  function sub(a, b) { return isNum(a) && isNum(b) ? a - b : null; }
  function stdev(arr) {
    if (arr.length < 2) return null;
    var m = avg(arr), s = 0;
    for (var i = 0; i < arr.length; i++) s += (arr[i] - m) * (arr[i] - m);
    return Math.sqrt(s / (arr.length - 1));
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function deepFill(t, tpl) {
    for (var k in tpl) {
      if (!tpl.hasOwnProperty(k)) continue;
      if (t[k] === undefined) t[k] = isObj(tpl[k]) || isArr(tpl[k]) ? clone(tpl[k]) : tpl[k];
      else if (isObj(tpl[k]) && isObj(t[k])) deepFill(t[k], tpl[k]);
    }
    return t;
  }
  function getPath(o, path) {
    var p = path.split('.');
    for (var i = 0; i < p.length; i++) { if (o === null || o === undefined) return null; o = o[p[i]]; }
    return o === undefined ? null : o;
  }
  function setPath(o, path, v) {
    var p = path.split('.');
    for (var i = 0; i < p.length - 1; i++) { if (o[p[i]] === null || typeof o[p[i]] !== 'object') o[p[i]] = {}; o = o[p[i]]; }
    o[p[p.length - 1]] = v;
  }

  /* ---------- units (stored inside the app as psi, deg C, litres, mm, kg) ---------- */
  var PU = { psi: { f: 1, dp: 2, l: 'psi' }, bar: { f: 1 / 14.5038, dp: 3, l: 'bar' }, kpa: { f: 6.89476, dp: 1, l: 'kPa' } };
  var FU = { L: { f: 1, dp: 2, l: 'L' }, gal: { f: 1 / 3.78541, dp: 2, l: 'US gal' } };
  function st() { return DB.settings; }
  function pu() { return PU[st().pUnit] || PU.psi; }
  function fu() { return FU[st().fUnit] || FU.L; }
  function tl() { return st().tUnit === 'F' ? '°F' : '°C'; }
  function toShow(kind, v) {
    if (!isNum(v)) return null;
    if (kind === 'p') return v * pu().f;
    if (kind === 't') return st().tUnit === 'F' ? v * 9 / 5 + 32 : v;
    if (kind === 'td') return st().tUnit === 'F' ? v * 9 / 5 : v;
    if (kind === 'f') return v * fu().f;
    return v;
  }
  function toStore(kind, v) {
    if (!isNum(v)) return null;
    if (kind === 'p') return v / pu().f;
    if (kind === 't') return st().tUnit === 'F' ? (v - 32) * 5 / 9 : v;
    if (kind === 'td') return st().tUnit === 'F' ? v * 5 / 9 : v;
    if (kind === 'f') return v / fu().f;
    return v;
  }
  function dpOf(kind) {
    if (kind === 'p') return pu().dp;
    if (kind === 'f') return fu().dp;
    if (kind === 't' || kind === 'td') return 1;
    return 3;
  }
  function P(v) { return isNum(v) ? trim0(toShow('p', v), pu().dp) + ' ' + pu().l : '-'; }
  function Pd(v) { return isNum(v) ? sgn(toShow('p', v), pu().dp) : '-'; }
  function T(v) { return isNum(v) ? fx(toShow('t', v), 1) + tl() : '-'; }
  function Td(v) { return isNum(v) ? sgn(toShow('td', v), 1) + '°' : '-'; }
  function F(v) { return isNum(v) ? fx(toShow('f', v), 2) + ' ' + fu().l : '-'; }

  /* ---------- data model ---------- */
  function defSettings() {
    return {
      car: '', keepAwake: false, buzz: true, checklist: '', defDriver: '', defDrivers: ['', '', '', ''], ruleWarn: 5, defCarNo: '', defTransponder: '', defClass: '', laptop: '', pUnit: 'psi', tUnit: 'C', fUnit: 'L', theme: 'light',
      targetHotF: null, targetHotR: null, hotTol: null,
      spreadThr: null, midThr: null, minTread: null,
      density: 0.745, tank: null, cleanPct: 105, fplCheck: 10
    };
  }
  function defSync() { return { url: '', key: '', lastSync: null, lastResult: '', state: {}, log: [] }; }
  function defDB() { return { version: 1, created: Date.now(), settings: defSettings(), sync: defSync(), sessions: [], runs: [], tomb: [], log: [], lastBackup: null, lastLaptop: null }; }
  function c4(v) { return { FL: v, FR: v, RL: v, RR: v }; }
  function tt() { return { i: null, m: null, o: null }; }
  function runTemplate() {
    return {
      id: '', sessionId: '', no: 1, created: 0, modified: 0, driver: '',
      tyreSet: '', compound: '', weather: '', ambient: null, trackT: null,
      timeOut: null, timeIn: null, setup: '', prefill: null, check: {},
      b: { p: c4(null), tread: c4(null), fuel: null, rhF: null, rhR: null },
      a: { p: c4(null), t: { FL: tt(), FR: tt(), RL: tt(), RR: tt() }, brake: c4(null), tread: c4(null),
        fuel: null, laps: null, lapTimes: '', oil: null, water: null, fbE: '', fbM: '', fbX: '', notes: '' },
      stop: { fuelAdded: null, tyresChanged: false, driverChange: false, dur: null, work: '' }
    };
  }
  function sessionTemplate() { return { id: '', created: 0, modified: 0, event: '', track: '', date: '', type: 'Practice', car: '', carNo: '', transponder: '', cls: '', driver: '', drivers: ['', '', '', ''], raceLen: null, minDrive: null, maxDrive: null, maxStint: null, notes: '' }; }
  function normalize(d) {
    if (!isObj(d)) d = defDB();
    if (!isObj(d.settings)) d.settings = {};
    deepFill(d.settings, defSettings());
    if (!isObj(d.sync)) d.sync = {};
    deepFill(d.sync, defSync());
    if (!isArr(d.sessions)) d.sessions = [];
    if (!isArr(d.runs)) d.runs = [];
    if (!isArr(d.tomb)) d.tomb = [];
    if (!isArr(d.log)) d.log = [];
    if (d.lastLaptop === undefined) d.lastLaptop = null;
    for (var i = 0; i < d.sessions.length; i++) {
      var ss = d.sessions[i];
      if (!isArr(ss.drivers)) ss.drivers = [ss.driver || '', '', '', ''];
      deepFill(ss, sessionTemplate());
      while (ss.drivers.length < 4) ss.drivers.push('');
    }
    if (!isArr(d.settings.defDrivers)) d.settings.defDrivers = [d.settings.defDriver || '', '', '', ''];
    while (d.settings.defDrivers.length < 4) d.settings.defDrivers.push('');
    for (var j = 0; j < d.runs.length; j++) deepFill(d.runs[j], runTemplate());
    return d;
  }
  function load() {
    var raw = null, d = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) {
      try { d = JSON.parse(raw); } catch (e2) {
        d = null;
        try { localStorage.setItem(KEY + '_broken', raw); } catch (e3) { /* ignore */ }
        alert('Saved data could not be read. A copy was kept and the app started fresh. Contact whoever set up PitLog.');
      }
    }
    DB = normalize(d);
  }
  function defUI() {
    return {
      view: 'sessions', sessionId: null, runId: null, runTab: 'before', tool: 'fuel',
      an: { sessionId: '', metric: 'best', a: '', b: '' },
      t: { strat: { mode: 'laps', raceLaps: null, raceMin: null, lapTime: null, fpl: null, tank: null, startFuel: null, reserve: null, refuel: null, pitLoss: null, tyreTime: null, tyreLife: null, concurrent: true, minStat: null, maxStint: null, minStops: null, pick: null },
        fuel: { laps: null, fpl: null, margin: null, inTank: null }, pc: { p1: null, t1: null, t2: null },
        cw: { FL: null, FR: null, RL: null, RR: null }, cv: { cat: 'Pressure', from: '', val: null } }
    };
  }
  function loadUI() {
    var u = null;
    try { u = JSON.parse(localStorage.getItem(KEY_UI) || 'null'); } catch (e) { u = null; }
    S = deepFill(isObj(u) ? u : {}, defUI());
    var w = null;
    try { w = JSON.parse(localStorage.getItem(KEY_WATCH) || 'null'); } catch (e2) { w = null; }
    W = deepFill(isObj(w) ? w : {}, { running: false, start: 0, acc: 0, splits: [] });
  }
  function saveUI() { try { localStorage.setItem(KEY_UI, JSON.stringify(S)); } catch (e) { /* ignore */ } }
  function saveW() { try { localStorage.setItem(KEY_WATCH, JSON.stringify(W)); } catch (e) { /* ignore */ } }
  function save() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try {
      localStorage.setItem(KEY, JSON.stringify(DB));
      var e = $('saveSt'); if (e) e.innerHTML = 'Saved ' + hms(Date.now());
      return true;
    } catch (err) {
      alert('Could not save! The iPad storage for PitLog may be full. Go to Data & Sync, export a backup now, then delete old sessions.');
      return false;
    }
  }
  function scheduleSave(now) {
    if (now) { save(); return; }
    if (saveTimer) clearTimeout(saveTimer);
    var e = $('saveSt'); if (e) e.innerHTML = 'Saving...';
    saveTimer = setTimeout(save, 400);
  }
  function flush() { if (saveTimer) save(); }
  function log(msg) { DB.log.unshift({ t: Date.now(), m: msg }); if (DB.log.length > 300) DB.log.length = 300; }

  function findSession(id) { for (var i = 0; i < DB.sessions.length; i++) if (DB.sessions[i].id === id) return DB.sessions[i]; return null; }
  function findRun(id) { for (var i = 0; i < DB.runs.length; i++) if (DB.runs[i].id === id) return DB.runs[i]; return null; }
  function curSession() { return findSession(S.sessionId); }
  function curRun() { return findRun(S.runId); }
  function runsOf(sid) {
    var out = [];
    for (var i = 0; i < DB.runs.length; i++) if (DB.runs[i].sessionId === sid) out.push(DB.runs[i]);
    out.sort(function (a, b) { return a.no - b.no; });
    return out;
  }
  function sessName(s) { if (!s) return 'Session'; return (s.event || 'Untitled') + (s.type ? ' · ' + s.type : ''); }
  function sortedSessions() {
    return DB.sessions.slice().sort(function (a, b) {

    var d = null;
    try { d = JSON.parse(p); } catch (e2) { alert('Undo copy could not be read.'); return; }
    if (!confirm('Swap back to the data from before the last restore or delete (' + (d.sessions || []).length + ' sessions, ' + (d.runs || []).length + ' runs)?')) return;
    try { localStorage.setItem(KEY_PREV, JSON.stringify(DB)); } catch (e3) { /* ignore */ }
    DB = normalize(d);
    log('Undo: swapped back to earlier data');
    save(); go('sessions');
  }
  function wipe() {
    var pc = pendingCount();
    if (!confirm('Remove ALL sessions and runs from this iPad? Anything already synced stays in the laptop history.')) return;
    if (!confirm(pc ? 'WARNING: ' + pc + ' change(s) have NOT been synced to the laptop and will be lost. Continue anyway?' : 'Are you sure?')) return;
    try { localStorage.setItem(KEY_PREV, JSON.stringify(DB)); } catch (e) { if (!confirm('Could not keep an undo copy. Delete anyway?')) return; }
    DB.sessions = []; DB.runs = []; DB.tomb = []; DB.sync.state = {};
    log('Removed all sessions and runs from the iPad');
    save(); go('sessions');
  }

  /* ---------- wi-fi sync to laptop ---------- */
  function tombstone(kind, id) { if (DB.sync.state[id] !== undefined) DB.tomb.push({ id: id, kind: kind, t: Date.now() }); }
  function pendingItems() {
    var stt = DB.sync.state, out = [], i;
    for (i = 0; i < DB.sessions.length; i++) if (stt[DB.sessions[i].id] !== DB.sessions[i].modified) out.push({ k: 's', id: DB.sessions[i].id });
    for (i = 0; i < DB.runs.length; i++) if (stt[DB.runs[i].id] !== DB.runs[i].modified) out.push({ k: 'r', id: DB.runs[i].id });
    for (i = 0; i < DB.tomb.length; i++) out.push({ k: 'd', id: DB.tomb[i].id });
    return out;
  }
  function r3(v) { return isNum(v) ? round(v, 3) : null; }
  function summary(run) {
    var r = calc(run), o = { laps: r.laps, best: r3(r.best), cleanAvg: r3(r.cleanAvg), cleanN: r.cleanN, sd: r3(r.sd), fuelUsed: r3(r.fuelUsed), fpl: r3(r.fpl), nextFuel: r3(r.nextFuel),
      trackSec: isNum(r.trackMs) ? Math.round(r.trackMs / 1000) : null, build: {}, rec: {}, tAvg: {}, spread: {}, mid: {}, wear: {}, warnN: r.warn.length, warn: [] };
    for (var i = 0; i < C4.length; i++) {
      var c = C4[i];
      o.build[c] = r3(r.build[c]); o.rec[c] = r3(r.rec[c]); o.tAvg[c] = r3(r.tyre[c].avg); o.spread[c] = r3(r.tyre[c].spread); o.mid[c] = r3(r.tyre[c].mid); o.wear[c] = r3(r.wear[c]);
    }
    for (i = 0; i < r.warn.length; i++) o.warn.push(r.warn[i].m);
    return o;
  }
  function syncLog(m) { DB.sync.log.unshift({ t: Date.now(), m: m }); if (DB.sync.log.length > 100) DB.sync.log.length = 100; }
  function laptopBase() {
    var a = (st().laptop || '').trim();
    if (a) { if (!/^https?:\/\//.test(a)) a = 'http://' + a; return a.replace(/\/+$/, ''); }
    if (/^https?:$/.test(window.location.protocol)) return window.location.protocol + '//' + window.location.host;
    return '';
  }
  function xhr(method, url, body, cb, timeoutMs) {
    var x = new XMLHttpRequest(), done = false, t = null;
    function fin(ok, status, text) { if (done) return; done = true; if (t) clearTimeout(t); cb(ok, status, text || ''); }
    try { x.open(method, url, true); } catch (e) { fin(false, 0, ''); return; }
    x.onreadystatechange = function () { if (x.readyState === 4) fin(x.status >= 200 && x.status < 300, x.status, x.responseText); };
    t = setTimeout(function () { try { x.abort(); } catch (e2) { /* ignore */ } fin(false, 0, ''); }, timeoutMs || 30000);
    try { if (body !== null) x.setRequestHeader('Content-Type', 'text/plain'); x.send(body); } catch (e3) { fin(false, 0, ''); }
  }
  var laptopTransport = xhr;
  function lapMsg(html) { var e = $('lapMsg'); if (e) e.innerHTML = html; }
  function laptopPanel() {
    var y = DB.sync, pc = pendingCount(), lg = '';
    for (var i = 0; i < Math.min(15, y.log.length); i++) lg += '<tr><td>' + dateTime(y.log[i].t) + '</td><td>' + esc(y.log[i].m) + '</td></tr>';
    return row([col(2, fld('Laptop address', inp('settings', st(), 'laptop', 's', laptopBase() || 'e.g. 192.168.1.23:8000'))),
      col(2, '<div style="padding-top:18px">' + btn('Sync to laptop now' + (pc ? ' (' + pc + ')' : ''), 'lapSync', null, 'pri') + btn('Get latest backup from laptop', 'lapFetch', null, 'sm') + '</div>')]) +
      '<div id="lapMsg" class="hint">' + (pc ? pc + ' change' + (pc > 1 ? 's' : '') + ' waiting to sync. ' : 'Everything is synced. ') + 'Last sync: ' + dateTime(y.lastSync) + (DB.lastLaptop ? ' (' + esc(DB.lastLaptop.file) + ')' : '') + '</div>' +
      '<p class="hint">Run serve.py on the laptop and join the same Wi-Fi. No internet needed. Leave the address empty to use the one PitLog was installed from. ' +
      'Each sync saves a full dated backup on the laptop and updates the laptop history (runs.csv and sessions.csv for Excel or Google Sheets). Sync never deletes anything on the laptop.</p>' +
      (lg ? '<div class="tblw"><table><tr><th>When</th><th>Sync log</th></tr>' + lg + '</table></div>' : '');
  }
  function lapSync() {
    var base = laptopBase();
    if (!base) { alert('Enter the laptop address first, for example 192.168.1.23:8000'); return; }
    if (syncBusy) return;
    flush();
    var snap = {}, calcs = {}, tombIds = [], i, nS = DB.sessions.length, nR = DB.runs.length;
    for (i = 0; i < DB.sessions.length; i++) snap[DB.sessions[i].id] = DB.sessions[i].modified;
    for (i = 0; i < DB.runs.length; i++) { snap[DB.runs[i].id] = DB.runs[i].modified; calcs[DB.runs[i].id] = summary(DB.runs[i]); }
    for (i = 0; i < DB.tomb.length; i++) tombIds.push(DB.tomb[i].id);
    var body = JSON.stringify({ app: 'PitLog', version: VERSION, sent: Date.now(), db: DB, calc: calcs });
    syncBusy = true;
    lapMsg('Syncing to the laptop...');
    laptopTransport('POST', base + '/sync', body, function (ok, status, text) {
      syncBusy = false;
      var r = null, m;
      try { r = JSON.parse(text); } catch (e) { r = null; }
      if (ok && r && r.ok && r.sessions === nS && r.runs === nR) {
        for (var k in snap) if (snap.hasOwnProperty(k)) DB.sync.state[k] = snap[k];
        DB.tomb = DB.tomb.filter(function (t) { return tombIds.indexOf(t.id) < 0; });
        for (i = 0; i < tombIds.length; i++) delete DB.sync.state[tombIds[i]];
        DB.lastBackup = DB.sync.lastSync = Date.now();
        DB.lastLaptop = { t: Date.now(), file: r.file };
        var h = r.history || {};
        m = 'Sync OK: ' + (h.inserted || 0) + ' new, ' + (h.updated || 0) + ' updated, ' + (h.deleted || 0) + ' marked deleted. Laptop now holds ' + h.sessions + ' sessions, ' + h.runs + ' runs.';
        DB.sync.lastResult = 'OK';
        syncLog(m); log('Synced to laptop (' + r.file + ')'); save(); render();
        lapMsg('<span class="good"><b>' + esc(m) + '</b></span>');
      } else {
        if (ok && r && r.ok) m = 'Sync check failed: the laptop received ' + r.sessions + ' sessions and ' + r.runs + ' runs, the iPad has ' + nS + ' and ' + nR + '. Try again.';
        else m = r && r.err ? 'Sync failed: ' + r.err : 'Sync failed: could not reach the laptop at ' + base + '. Check: same Wi-Fi, serve.py is running, address is right.';
        DB.sync.lastResult = 'failed';
        syncLog(m); save();
        lapMsg('<span class="bad"><b>' + esc(m) + '</b></span>');
      }
    }, 90000);
  }
  function lapFetch() {
    var base = laptopBase();
    if (!base) { alert('Enter the laptop address first, for example 192.168.1.23:8000'); return; }
    lapMsg('Getting the latest backup from the laptop...');
    laptopTransport('GET', base + '/backups/latest', null, function (ok, status, text) {
      var r = null;
      try { r = JSON.parse(text); } catch (e) { r = null; }
      if (r && r.ok && isObj(r.data) && isObj(r.data.db)) r.data = r.data.db;
      if (!ok || !r || !r.ok || !isObj(r.data)) { lapMsg('<span class="bad"><b>' + esc(r && r.err ? r.err : 'Could not get a backup from ' + base + '.') + '</b></span>'); return; }
      var box = $('importBox');
      if (box) box.value = JSON.stringify(r.data);
      lapMsg('Loaded ' + esc(r.file) + ' (' + (r.data.sessions || []).length + ' sessions, ' + (r.data.runs || []).length + ' runs) into the Restore box below. Tap <b>Restore</b> to use it.');
    }, 90000);
  }

  /* ---------- actions ---------- */
  function go(view) { S.view = view; saveUI(); render(); window.scrollTo(0, 0); }
  function createRun(sid) {
    var list = runsOf(sid), prev = list.length ? list[list.length - 1] : null, r = runTemplate();
    r.id = uid(); r.sessionId = sid; r.no = prev ? prev.no + 1 : 1; r.created = r.modified = Date.now();
    var lu = lineup(findSession(sid));
    r.driver = lu[0] || '';
    if (prev) {
      var pf = [], c, i;
      var dv = prev.driver || lu[0] || '';
      if (prev.stop.driverChange && lu.length > 1) { dv = lu[(lu.indexOf(prev.driver) + 1) % lu.length]; pf.push('driver ' + dv + ' (driver change ticked on Run ' + prev.no + ')'); }
      else if (dv && lu.length > 1) pf.push('driver ' + dv);
      r.driver = dv;
      if (!prev.stop.tyresChanged) {
        if (prev.tyreSet) { r.tyreSet = prev.tyreSet; r.compound = prev.compound; pf.push('tyre set'); }
        var tc = false;
        for (i = 0; i < C4.length; i++) { c = C4[i]; if (isNum(prev.a.tread[c])) { r.b.tread[c] = prev.a.tread[c]; tc = true; } }
        if (tc) pf.push('tread (from Run ' + prev.no + ' after)');
      }
      var nf = calc(prev).nextFuel;
      if (isNum(nf)) { r.b.fuel = nf; pf.push('fuel (fuel left + fuel added)'); }
      if (isNum(prev.b.rhF) || isNum(prev.b.rhR)) { r.b.rhF = prev.b.rhF; r.b.rhR = prev.b.rhR; pf.push('ride heights'); }
      if (prev.weather) { r.weather = prev.weather; pf.push('weather'); }
      if (pf.length) r.prefill = { from: prev.no, f: pf };
    }
    DB.runs.push(r);
    var s = findSession(sid);
    log('Created Run ' + r.no + ' in ' + sessName(s));
    save();
    return r;
  }
  function parseTimeInput(txt, base) {
    var m = /^\s*(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?\s*$/.exec(txt || '');
    if (!m) return null;
    var h = +m[1], mi = +m[2], se = m[3] ? +m[3] : 0;
    if (h > 23 || mi > 59 || se > 59) return null;
    var d = new Date(base || Date.now());
    d.setHours(h, mi, se, 0);
    return d.getTime();
  }
  var ACT = {
    nav: function (v) { if (v === 'analysis' && S.sessionId) S.an.sessionId = S.sessionId; go(v); },
    newSession: function () {
      var s = sessionTemplate();
      s.id = uid(); s.created = s.modified = Date.now(); s.date = today(); s.car = st().car;
      s.drivers = st().defDrivers.slice(0, 4); s.carNo = st().defCarNo; s.transponder = st().defTransponder; s.cls = st().defClass;
      DB.sessions.push(s); log('Created session'); save();
      S.sessionId = s.id; go('session');
    },
    openSession: function (id) { S.sessionId = id; go('session'); },
    carFilter: function (c) { S.carFilter = c || ''; go('sessions'); },
    refreshDrv: function () { var e = $('drvBox'), s = curSession(); if (e && s) e.innerHTML = driverCard(s, Date.now()); },
    copySession: function () {
      var o = curSession(), s = sessionTemplate();
      s.id = uid(); s.created = s.modified = Date.now();
      s.event = o.event; s.track = o.track; s.date = o.date; s.type = o.type; s.cls = o.cls;
      s.raceLen = o.raceLen; s.minDrive = o.minDrive; s.maxDrive = o.maxDrive; s.maxStint = o.maxStint;
      DB.sessions.push(s); log('Added another car to ' + sessName(o)); save();
      S.sessionId = s.id; go('session');
      alert('New session made for another car with the same event, track, date, type, class and drive time rules. Fill in its car number, transponder and drivers.');
    },
    delSession: function () {
      var s = curSession(), rs = runsOf(s.id);
      if (!confirm('Delete "' + sessName(s) + '" and its ' + rs.length + ' run(s) from this iPad?')) return;
      var everywhere = confirm('Was this session a mistake?\n\nOK = yes, also mark it deleted in the laptop history on the next sync.\nCancel = no, keep it in the laptop history (just freeing space on the iPad).');
      for (var i = 0; i < rs.length; i++) { if (everywhere) tombstone('run', rs[i].id); delete DB.sync.state[rs[i].id]; }
      if (everywhere) tombstone('session', s.id);
      delete DB.sync.state[s.id];
      DB.runs = DB.runs.filter(function (r) { return r.sessionId !== s.id; });
      DB.sessions = DB.sessions.filter(function (x) { return x.id !== s.id; });
      log('Deleted session ' + sessName(s) + ' (' + rs.length + ' runs)'); save(); go('sessions');
    },
    newRun: function () { var r = createRun(S.sessionId); S.runId = r.id; S.runTab = 'before'; go('run'); },
    openRun: function (id) { var r = findRun(id); if (!r) return; S.runId = id; S.runTab = r.timeIn ? 'results' : (r.timeOut ? 'after' : 'before'); go('run'); },
    openRunRes: function (id) { S.runId = id; S.runTab = 'results'; go('run'); },
    runTab: function (t) { S.runTab = t; flush(); go('run'); },
    stamp: function (f) { var r = curRun(); if (r[f] && !confirm('Replace ' + hms(r[f]) + ' with the time now?')) return; r[f] = Date.now(); r.modified = Date.now(); save(); render(); },
    editStamp: function (f) {
      var r = curRun(), v = prompt('Enter time as HH:MM or HH:MM:SS (24-hour)', r[f] ? hms(r[f]) : '');
      if (v === null) return;
      var t = parseTimeInput(v, r[f] || r.created);
      if (t === null) { alert('Could not read that time. Example: 14:05 or 14:05:30'); return; }
      r[f] = t; r.modified = Date.now(); save(); render();
    },
    clearStamp: function (f) { var r = curRun(); if (!confirm('Clear this time?')) return; r[f] = null; r.modified = Date.now(); save(); render(); },
    dismissPrefill: function () { var r = curRun(); r.prefill = null; r.modified = Date.now(); save(); render(); },
    useRec: function (pid) {
      var run = curRun(), prev = findRun(pid), pr = calc(prev), lines = [];
      for (var i = 0; i < C4.length; i++) if (isNum(pr.rec[C4[i]])) lines.push(C4[i] + ' ' + P(pr.rec[C4[i]]));
      if (!confirm('Fill cold pressures with Run ' + prev.no + ' recommendation?\n' + lines.join(', ') + '\nYou still set the tyres to these yourself.')) return;
      for (i = 0; i < C4.length; i++) if (isNum(pr.rec[C4[i]])) run.b.p[C4[i]] = round(pr.rec[C4[i]], 4);
      run.modified = Date.now(); save(); render();
    },
    delRun: function () {
      var r = curRun();
      if (!confirm('Delete Run ' + r.no + '? This cannot be undone here.')) return;
      tombstone('run', r.id);
      DB.runs = DB.runs.filter(function (x) { return x.id !== r.id; });
      log('Deleted Run ' + r.no + ' in ' + sessName(findSession(r.sessionId))); save(); go('session');
    },
    anSession: function (id) { S.an.sessionId = id; go('analysis'); },
    tool: function (t) { S.tool = t; go('tools'); },
    fuelAvg: function () { S.t.fuel.fpl = sessFpl(S.sessionId, null).avg; saveUI(); render(); },
    wStart: function () { if (W.running) { W.acc = wElapsed(); W.running = false; } else { W.start = Date.now(); W.running = true; } saveW(); render(); },
    wSplit: function () { if (!W.running) return; W.splits.push(wElapsed()); saveW(); render(); },
    wReset: function () { if (W.splits.length && !confirm('Clear the stopwatch and splits?')) return; W = { running: false, start: 0, acc: 0, splits: [] }; saveW(); render(); },
    wSave: function () {
      var run = curRun(); if (!run) return;
      var secs = round(wElapsed() / 1000, 1);
      if (!confirm('Save ' + secs + ' s as the pit stop time for Run ' + run.no + '?')) return;
      run.stop.dur = secs; run.modified = Date.now(); save(); alert('Saved to Run ' + run.no + '.');
    },
    stratPick: function (n) { S.t.strat.pick = +n; saveUI(); refreshTool(); },
    stratFill: stratFill,
    wLaps: function () {
      var run = curRun(); if (!run || !W.splits.length) return;
      var laps = [];
      for (var i = 0; i < W.splits.length; i++) laps.push(lapFmt((W.splits[i] - (i ? W.splits[i - 1] : 0)) / 1000));
      if (!confirm('Add ' + laps.length + ' lap time(s) to Run ' + run.no + '?\n' + laps.join(' '))) return;
      run.a.lapTimes = (String(run.a.lapTimes || '').trim() ? String(run.a.lapTimes).trim() + ' ' : '') + laps.join(' ');
      run.modified = Date.now(); save(); alert('Added to Run ' + run.no + '. Check them on its After tab.');
    },
    fileBackup: function () { backupFile(false); }, shareBackup: function () { backupFile(true); },
    fileCsv: function () { csvFile(false); }, shareCsv: function () { csvFile(true); },
    install: function () { if (!installPrompt) return; installPrompt.prompt(); installPrompt = null; },
    exportCSV: exportCSV, exportJSON: exportJSON, restore: restore, undoRestore: undoRestore, wipe: wipe,
    lapSync: lapSync, lapFetch: lapFetch
  };

  /* ---------- events ---------- */
  function onClick(e) {
    var el = e.target;
    while (el && el !== document) {
      if (el.getAttribute && el.getAttribute('data-act')) {
        var a = el.getAttribute('data-act');
        if (ACT[a]) { e.preventDefault(); ACT[a](el.getAttribute('data-arg'), el); }
        return;
      }
      el = el.parentNode;
    }
  }
  function scopeObj(scope) {
    if (scope === 'run') return curRun();
    if (scope === 'session') return curSession();
    if (scope === 'settings') return DB.settings;
    if (scope === 'sync') return DB.sync;
    if (scope === 'ui') return S;
    return null;
  }
  function onField(e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.id === 'fileIn' && e.type === 'change') { openBackupFile(el); return; }
    var scope = el.getAttribute('data-scope');
    if (!scope) return;
    var obj = scopeObj(scope);
    if (!obj) return;
    var kind = el.getAttribute('data-kind'), path = el.getAttribute('data-path'), val;
    if (kind === 'b') val = !!el.checked;
    else if (kind === 's' || kind === 'ta') val = el.value;
    else if (kind === 'lap') val = parseLap(String(el.value || ''));
    else val = toStore(kind, num(el.value));
    var isSel = el.tagName === 'SELECT';
    if (isSel && e.type === 'input') return;
    if (getPath(obj, path) === val && e.type === 'change' && !isSel) { if (scope !== 'ui') scheduleSave(true); return; }
    setPath(obj, path, val);
    if (scope === 'ui') { saveUI(); if (isSel) render(); else refreshTool(); return; }
    if (scope === 'run' || scope === 'session') obj.modified = Date.now();
    if (scope === 'run') updateLive();
    if (scope === 'session') { var dw = $('drvWrap'); if (dw) dw.innerHTML = drvWrapHtml(obj); }
    if (scope === 'settings' && path === 'keepAwake') applyWake();
    if (scope === 'settings' && isSel) { save(); render(); return; }
    scheduleSave(e.type === 'change');
  }

  /* ---------- render ---------- */
  function render() {
    document.body.className = st().theme === 'dark' ? 'dark' : '';
    if (S.view === 'run' && !curRun()) S.view = curSession() ? 'session' : 'sessions';
    if (S.view === 'session' && !curSession()) S.view = 'sessions';
    var v = S.view, body;
    if (v === 'session') body = vSession();
    else if (v === 'run') body = vRun();
    else if (v === 'analysis') body = vAnalysis();
    else if (v === 'tools') body = vTools();
    else if (v === 'data') body = vData();
    else body = vSessions();
    $('app').innerHTML = renderTop() + '<div class="wrap">' + body + '</div>';
    if (v === 'analysis') drawChart();
    if (v === 'tools') { refreshTool(); if (S.tool === 'timer') startTick(); else stopTick(); } else stopTick();
    if (v === 'run') updateLive();
    startDrvTick();
    saveUI();
  }

  function init() {
    load(); loadUI();
    document.addEventListener('click', onClick, false);
    document.addEventListener('input', onField, false);
    document.addEventListener('change', onField, false);
    window.addEventListener('pagehide', flush, false);
    window.addEventListener('beforeunload', flush, false);
    window.addEventListener('resize', function () { if (S.view === 'analysis') drawChart(); }, false);
    if (window.applicationCache) {
      var evs = ['checking', 'downloading', 'progress', 'cached', 'noupdate', 'updateready', 'obsolete', 'error'];
      for (var i = 0; i < evs.length; i++) window.applicationCache.addEventListener(evs[i], updateCacheSt, false);
      window.applicationCache.addEventListener('updateready', function () {
        try { window.applicationCache.swapCache(); } catch (e) { /* ignore */ }
        if (confirm('A new version of PitLog was installed. Reload now? Your data is kept.')) window.location.reload();
      }, false);
    }
    if (navigator.serviceWorker && window.isSecureContext && !window.applicationCache) {
      var hadController = !!navigator.serviceWorker.controller, reloading = false;
      try {
        navigator.serviceWorker.register('sw.js').then(function () { updateCacheSt(); })['catch'](function () { updateCacheSt(); });
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          updateCacheSt();
          if (!hadController || reloading) { hadController = true; return; }
          reloading = true;
          if (confirm('A new version of PitLog was installed. Reload now? Your data is kept.')) window.location.reload();
        });
      } catch (e3) { /* ignore */ }
    }
    window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); installPrompt = ev; if (S.view === 'data') render(); }, false);
    document.addEventListener('visibilitychange', function () { applyWake(); }, false);
    applyWake();
    render();
  }

  window.PitLog = {
    db: function () { return DB; }, ui: function () { return S; }, calc: calc, act: ACT, render: render,
    setLaptopTransport: function (fn) { laptopTransport = fn; }, pending: pendingItems, strat: function (I) { return stratCalc(I); }, payload: payload
  };
  init();
})();
</script>
